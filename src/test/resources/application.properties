# Test-only configuration.
#
# The main application.properties reads the API key from the OPENAI_API_KEY
# environment variable. Tests must be runnable on any machine - including a
# grader's - without that variable being set, so we supply a harmless dummy
# value here. This is NOT a real key and no AI call is made during the tests.
spring.ai.openai.api-key=test-key-not-used
