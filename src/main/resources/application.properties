spring.application.name=taskflow-api

# ---- Spring AI / OpenAI ----------------------------------------------------
# The real API key is NEVER written here. ${OPENAI_API_KEY} reads the value
# from an environment variable at startup, so the secret stays on your machine
# and never reaches Git.
#
#   export OPENAI_API_KEY=your-real-key-here
#
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.7
